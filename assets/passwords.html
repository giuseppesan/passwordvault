<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Layout</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            display: flex;
        }

        #container {
            flex: 1;
            background-color: #f4f4f4;
            padding: 20px;
        }

        #navbar {
            width: 200px;
            background-color: #333;
            color: #fff;
            padding: 20px;
            box-sizing: border-box;
        }

        #navbar a {
            display: block;
            color: #fff;
            text-decoration: none;
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        #navbar a:hover {
            background-color: #555;
        }

        #loginButton {
            display: block;
            margin-top: 20px;
            padding: 10px;
            background-color: #3498db;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #loginButton:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

<div id="navbar">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
    <button id="loginButton">Login</button>
</div>

<div id="container">
    <!-- Your content goes here -->
    <h1>Main Content</h1>
    <p>This is the main content area on the right.</p>
</div>

<script>
    document.getElementById('loginButton').addEventListener('click', function() {
        alert('Login button clicked!');
        // You can add login functionality here
    });
</script>

</body>
</html>
