<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-container {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 800px;
        }

        .login-header {
            background-color: #3498db;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }

        .login-body {
            padding: 20px;
        }

        .login-body label {
            display: block;
            margin-bottom: 8px;
            color: #333333;
        }

        .login-body input {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .login-body button {
            width: 100%;
            padding: 10px;
            background-color: #3498db;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .login-body button:hover {
            background-color: #2980b9;
        }

        .register-link {
            display: block;
            text-align: center;
            margin-top: 10px;
            color: #3498db;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .login-container {
                max-width: none;
            }
        }
    </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
        <h2>Login</h2>
    </div>
    <div class="login-body">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="Enter your username">

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password">

        <button type="submit" id="loginButton">Login</button>
        Penis

        <a href="file:///registration.html" class="link" id="registerLink">Register</a>
        <a href="file:///passwords.html" class="link">Passwords</a>
        <a href="file:///base_template.html" class="link">BaseTemplate</a>
    </div>
</div>

<script>
  const links = document.querySelectorAll('link')
  links.forEach(link => {
    link.addEventListener('click', () => {
      window.ultralightApp.OnChangeURL(link.href);
    });
  });
</script>

</body>
</html>
