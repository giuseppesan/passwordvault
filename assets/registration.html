<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .register-container {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 800px;
        }

        .register-header {
            background-color: #3498db;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }

        .register-body {
            padding: 20px;
        }

        .register-body label {
            display: block;
            margin-bottom: 8px;
            color: #333333;
        }

        .register-body input {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .register-body button {
            width: 100%;
            padding: 10px;
            background-color: #3498db;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .register-body button:hover {
            background-color: #2980b9;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 10px;
            color: #3498db;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="register-container">
    <div class="register-header">
        <h2>Register</h2>
    </div>
    <div class="register-body">
        <label for="newUsername">Username:</label>
        <input type="text" id="newUsername" name="newUsername" placeholder="Choose a username">

        <label for="newPassword">Password:</label>
        <input type="password" id="newPassword" name="newPassword" placeholder="Choose a password">

        <button type="submit" id="registerButton">Register</button>

        <a href="#" class="back-link" id="backToLoginLink">Back to Login</a>
    </div>
</div>

<script>
    document.getElementById('backToLoginLink').addEventListener('click', function() {
        window.ultralightApp.goBackToLoginPage();
    });
</script>

</body>
</html>
